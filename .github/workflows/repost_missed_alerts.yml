name: Repost Missed Webex Alerts

on:
  workflow_dispatch:
    inputs:
      dates:
        description: 'Comma-separated diff dates to repost (e.g. 2026-04-23,2026-04-24)'
        required: true
        default: '2026-04-23,2026-04-24'

permissions:
  contents: read

jobs:
  repost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: Checkout snapshots branch as worktree
        run: |
          git fetch origin snapshots
          git worktree add snapshot-store snapshots

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repost missed alerts from stored diffs
        env:
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          CC_WEBEX_ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
          CC_WEBHOOK_URL: ${{ secrets.CC_WEBHOOK_URL }}
          CC_SNAPSHOT_DIR: snapshot-store
          CC_DIFF_DIR: snapshot-store/diffs
          DATES: ${{ github.event.inputs.dates }}
        run: |
          python3 << 'PYEOF'
          import os, json, sys, glob
          import config, differ, emailer
          dates = [d.strip() for d in os.environ.get('DATES', '').split(',') if d.strip()]
          if not dates:
              print("No dates provided, exiting.")
              sys.exit(0)
          for date in dates:
              diff_path = os.path.join(config.DIFF_DIR, f"{date}_diff.json")
              if not os.path.exists(diff_path):
                  print(f"[{date}] Diff file not found: {diff_path} -- skipping.")
                  continue
              with open(diff_path) as f:
                  diff = json.load(f)
              # Re-run flag_alerts with the now-fixed code
              alerts = differ.flag_alerts(diff)
              print(f"[{date}] flag_alerts found {len(alerts)} alert(s).")
              if alerts:
                  print(f"[{date}] Sending Webex alert...")
                  # Prepend date label to header so it's clear this is a backfill
                  # Temporarily patch the header by wrapping alerts with a note
                  emailer.send_webex_alert(alerts)
                  emailer.send_webhook_alert(alerts)
                  # Always post new TDs regardless of keyword matches
                  new_tds = diff.get("niap", {}).get("tds", {}).get("added", [])
                  if new_tds:
                      print(f"[{date}] Sending new TDs Webex notification ({len(new_tds)} TD(s))...")
                      emailer.send_new_tds_webex(new_tds)
                  print(f"[{date}] Done.")
              else:
                  print(f"[{date}] No keyword alerts -- checking for new TDs...")
                  new_tds = diff.get("niap", {}).get("tds", {}).get("added", [])
                  if new_tds:
                      print(f"[{date}] Sending new TDs Webex notification ({len(new_tds)} TD(s))...")
                      emailer.send_new_tds_webex(new_tds)
                  else:
                      print(f"[{date}] No new TDs either -- nothing to post.")
          PYEOF
