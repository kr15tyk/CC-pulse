name: CC Pulse — Daily & Weekly Run

# ── Triggers ──────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    # Daily pulse at 06:00 UTC
    - cron: "0 6 * * *"
    # Staging test dashboard at 06:30 UTC daily
    - cron: "30 6 * * *"
    # Weekly email digest every Monday at 07:00 UTC (fix #6)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
          - bootstrap
          - redash
          - readme
          - staging

# ── Permissions (minimal — only what is needed) ─────────────────────────────────────────────
permissions:
  contents: write # required to commit snapshots/ and docs/ back to repo
  actions: read

jobs:
  # ────────────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Determine run mode (non-daily modes skip straight to pulse)
  # ────────────────────────────────────────────────────────────────────────────────────
  resolve-mode:
    name: Resolve Run Mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}

    steps:
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode || 'daily' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "30 6 * * *" ]; then
            echo "mode=staging" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 7 * * 1" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=daily" >> "$GITHUB_OUTPUT"
          fi

  # ────────────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Parallel domain collection (matrix, daily mode only)
  # Each domain runs in its own runner concurrently.  A 403 or timeout on
  # one source stalls only that runner — all others continue.
  # ────────────────────────────────────────────────────────────────────────────────────
  collect:
    name: "Collect [${{ matrix.domain }}]"
    runs-on: ubuntu-latest
    needs: [resolve-mode]
    # Only run on daily mode — skip for weekly, staging, redash, etc.
    if: needs.resolve-mode.outputs.mode == 'daily'

    strategy:
      fail-fast: false   # one domain failing must not cancel the others
      matrix:
        domain:
          - niap
          - cc_portal
          - cctl_labs
          - csfc
          - cc_crypto
          - nist
          - nato
          - eucc

    steps:
      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect domain
        env:
          CC_LOG_LEVEL: INFO
        run: python collector.py --domain ${{ matrix.domain }} --out-dir snapshots/partial

      # Upload the partial JSON as a workflow artifact so the merge job can
      # download all of them in a single step regardless of job ordering.
      - name: Upload partial snapshot
        uses: actions/upload-artifact@v4
        with:
          name: partial-${{ matrix.domain }}
          path: snapshots/partial/${{ matrix.domain }}.json
          retention-days: 1
          if-no-files-found: warn

  # ────────────────────────────────────────────────────────────────────────────────────
  # JOB 3a — Merge + notify (daily mode)
  # Runs after ALL collect matrix jobs (even if some failed, via always()).
  # Downloads all partial artifacts, merges into a full snapshot, diffs,
  # renders the dashboard, and fires Webex/email alerts.
  # ────────────────────────────────────────────────────────────────────────────────────
  merge-and-notify:
    name: Merge & Notify
    runs-on: ubuntu-latest
    needs: [resolve-mode, collect]
    # Run even if some collect jobs failed (always()); the merge step handles
    # missing partials gracefully. The sanity check rejects critically empty data.
    if: always() && needs.resolve-mode.outputs.mode == 'daily'

    steps:
      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Download all partial snapshots from matrix collect jobs
      - name: Download partial snapshots
        uses: actions/download-artifact@v4
        with:
          pattern: partial-*
          path: snapshots/partial
          merge-multiple: true

      - name: Merge, diff, and notify
        env:
          CC_EMAIL_PASSWORD: ${{ secrets.CC_EMAIL_PASSWORD }}
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          CC_WEBEX_ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
          CC_EMAIL_USERNAME: ${{ secrets.CC_EMAIL_USERNAME }}
          CC_EMAIL_RECIPIENTS: ${{ secrets.CC_EMAIL_RECIPIENTS }}
          CC_SMTP_HOST: ${{ secrets.CC_SMTP_HOST }}
          CC_LOG_LEVEL: INFO
        run: python main.py --merge

      - name: Commit snapshots and dashboard
        # stefanzweifel/git-auto-commit-action v7.1.0
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          commit_message: "chore: CC Pulse auto-update [skip ci]"
          file_pattern: "snapshots/ docs/"
          commit_user_name: "cc-pulse-bot"
          commit_user_email: "cc-pulse-bot@users.noreply.github.com"
          skip_dirty_check: false

  # ────────────────────────────────────────────────────────────────────────────────────
  # JOB 3b — Non-daily pulse (weekly, staging, redash, bootstrap, readme)
  # Replaces the old single-job pulse for all non-daily scheduled/manual runs.
  # ────────────────────────────────────────────────────────────────────────────────────
  pulse:
    name: Pulse (non-daily)
    runs-on: ubuntu-latest
    needs: [resolve-mode]
    if: needs.resolve-mode.outputs.mode != 'daily'

    steps:
      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run CC Pulse
        env:
          CC_EMAIL_PASSWORD: ${{ secrets.CC_EMAIL_PASSWORD }}
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          CC_WEBEX_ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
          CC_EMAIL_USERNAME: ${{ secrets.CC_EMAIL_USERNAME }}
          CC_EMAIL_RECIPIENTS: ${{ secrets.CC_EMAIL_RECIPIENTS }}
          CC_SMTP_HOST: ${{ secrets.CC_SMTP_HOST }}
          CC_LOG_LEVEL: INFO
        run: |
          MODE="${{ needs.resolve-mode.outputs.mode }}"
          echo "Running in mode: $MODE"
          case "$MODE" in
            weekly)    python main.py --weekly ;;
            bootstrap) python main.py --bootstrap ;;
            redash)    python main.py --redash ;;
            readme)    python main.py --readme ;;
            staging)   python main.py --staging ;;
            *)         python main.py ;;
          esac

      - name: Commit snapshots and dashboard
        # stefanzweifel/git-auto-commit-action v7.1.0
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          commit_message: "chore: CC Pulse auto-update [skip ci]"
          file_pattern: "snapshots/ docs/"
          commit_user_name: "cc-pulse-bot"
          commit_user_email: "cc-pulse-bot@users.noreply.github.com"
          skip_dirty_check: false

  # ────────────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Workflow failure notification (issue #20)
  # Fires a Webex alert whenever ANY upstream job fails.
  # ────────────────────────────────────────────────────────────────────────────────────
  notify_failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [resolve-mode, collect, merge-and-notify, pulse]
    if: failure()

    steps:
      - name: Checkout repository
        # actions/checkout v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send failure alert to Webex
        env:
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          CC_WEBEX_ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
        run: |
          python - <<'EOF'
          import emailer
          emailer.send_workflow_failure_alert(
              run_id="${{ github.run_id }}",
              run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              workflow="${{ github.workflow }}",
              branch="${{ github.ref_name }}",
          )
          EOF
