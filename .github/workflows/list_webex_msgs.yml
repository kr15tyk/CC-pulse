name: List Webex Messages (one-time)
on:
  workflow_dispatch:
    inputs:
      max_messages:
        description: Number of recent messages to list
        required: false
        default: "50"
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List recent Webex messages
        env:
          WEBEX_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          WEBEX_ROOM: ${{ secrets.CC_WEBEX_ROOM_ID }}
          MAX_MSGS: ${{ github.event.inputs.max_messages }}
        run: |
          curl -s "https://webexapis.com/v1/messages?roomId=${WEBEX_ROOM}&max=${MAX_MSGS}" -H "Authorization: Bearer ${WEBEX_TOKEN}" > /tmp/msgs.json
          echo "File size:"
          wc -c /tmp/msgs.json
          echo "First 200 chars:"
          head -c 200 /tmp/msgs.json
          echo ""
          echo "Parsed messages:"
          cat /tmp/msgs.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('COUNT:',len(d.get('items',[]))) or [print('MSG:', m.get('created','')[:19], '|', m.get('id',''), '|', m.get('personEmail','')) for m in d.get('items',[])]"
