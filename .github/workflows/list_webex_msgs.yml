name: List Webex Messages (one-time)
on:
  workflow_dispatch:
    inputs:
      max_messages:
        description: Number of recent messages to list
        required: false
        default: "50"
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: List recent Webex messages
        env:
          WEBEX_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          WEBEX_ROOM: ${{ secrets.CC_WEBEX_ROOM_ID }}
          MAX_MSGS: ${{ github.event.inputs.max_messages }}
        run: |
          curl -s "https://webexapis.com/v1/messages?roomId=${WEBEX_ROOM}&max=${MAX_MSGS}" -H "Authorization: Bearer ${WEBEX_TOKEN}" > /tmp/msgs.json
          echo "=== HTTP status check ==="
          wc -c /tmp/msgs.json
          echo "=== Message list ==="
          python3 << 'PYEOF'
import json
with open('/tmp/msgs.json') as f:
    raw = f.read()
data = json.loads(raw)
msgs = data.get('items', [])
print(f'Total messages: {len(msgs)}')
for m in msgs:
    mid = m.get('id','')
    created = m.get('created','')
    person = m.get('personEmail','')
    text = m.get('text','')[:50].replace(chr(10),' ')
    print(f'{created} | {mid} | {person} | {text}')
PYEOF
