name: Post Webex Maintenance Notice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  post-notice:
    name: Post Maintenance Notice to Webex
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Post maintenance notice
        env:
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          CC_WEBEX_ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
        run: python3 scripts/webex/post_maintenance_notice.py
