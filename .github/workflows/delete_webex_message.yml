name: Delete Webex Failure Message

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-message:
    name: Delete Workflow Failure Alert
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Find and delete failure alert message
        env:
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          CC_WEBEX_ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
        run: python3 scripts/webex/delete_failure_alerts.py
