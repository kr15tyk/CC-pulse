name: Send Filtered Stored Alert

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Stored diff date (YYYY-MM-DD)"
        required: true
        type: string
      source:
        description: "Exact alert source, or NIAP News ID"
        required: true
        type: string
      title:
        description: "Exact alert title, or numeric NIAP announcement ID"
        required: true
        type: string
      dry_run:
        description: "Validate the match without sending notifications"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  send:
    name: Send one stored alert
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout snapshots
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: snapshots
          path: snapshot-store

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Select and send alert
        if: ${{ inputs.source != 'NIAP News ID' }}
        env:
          ALERT_DATE: ${{ inputs.date }}
          ALERT_SOURCE: ${{ inputs.source }}
          ALERT_TITLE: ${{ inputs.title }}
          CC_DRY_RUN: ${{ inputs.dry_run }}
          CC_EMAIL_PASSWORD: ${{ secrets.CC_EMAIL_PASSWORD }}
          CC_EMAIL_USERNAME: ${{ secrets.CC_EMAIL_USERNAME }}
          CC_EMAIL_RECIPIENTS: ${{ secrets.CC_EMAIL_RECIPIENTS }}
          CC_SMTP_HOST: ${{ secrets.CC_SMTP_HOST }}
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          CC_WEBEX_ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
          CC_WEBHOOK_URL: ${{ secrets.CC_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import config
          import emailer

          diff_path = Path("snapshot-store/diffs") / f"{os.environ['ALERT_DATE']}_diff.json"
          diff = json.loads(diff_path.read_text(encoding="utf-8"))
          matches = [
              alert for alert in diff.get("alerts", [])
              if alert.get("source") == os.environ["ALERT_SOURCE"]
              and alert.get("title") == os.environ["ALERT_TITLE"]
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected exactly one alert match, found {len(matches)} for "
                  f"{os.environ['ALERT_SOURCE']!r} / {os.environ['ALERT_TITLE']!r}"
              )

          alert = matches[0]
          print(f"Selected one alert: {alert['source']} — {alert['title']}")
          if config.DRY_RUN:
              print("Dry run enabled; notification sends skipped.")
          else:
              emailer.send_webex_alert(matches)
              emailer.send_webhook_alert(matches)
              emailer.send_alert_email(matches)
              print("Sent Webex, webhook, and immediate email notifications.")
          PY

      - name: Validate stored NIAP news item
        if: ${{ inputs.source == 'NIAP News ID' && inputs.dry_run }}
        env:
          BACKFILL_DATE: ${{ inputs.date }}
          BACKFILL_NEWS_ID: ${{ inputs.title }}
        run: >-
          python scripts/webex/backfill_niap_news.py
          --snapshot-dir snapshot-store
          --date "$BACKFILL_DATE"
          --news-id "$BACKFILL_NEWS_ID"

      - name: Send stored NIAP news item
        if: ${{ inputs.source == 'NIAP News ID' && !inputs.dry_run }}
        env:
          BACKFILL_DATE: ${{ inputs.date }}
          BACKFILL_NEWS_ID: ${{ inputs.title }}
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          CC_WEBEX_ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
        run: >-
          python scripts/webex/backfill_niap_news.py
          --snapshot-dir snapshot-store
          --date "$BACKFILL_DATE"
          --news-id "$BACKFILL_NEWS_ID"
          --send
