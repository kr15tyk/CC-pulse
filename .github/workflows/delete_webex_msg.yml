name: Delete Webex Message (one-time)

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: Webex message ID to delete
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v6.0.2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Delete Webex message
        env:
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}
        run: python3 scripts/webex/delete_message_by_id.py
