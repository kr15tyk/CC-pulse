name: Delete Webex Message (one-time)

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: Webex message ID to delete
        required: true

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Delete Webex message
        env:
          CC_WEBEX_BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          MESSAGE_ID: ${{ github.event.inputs.message_id }}
        run: python3 scripts/webex/delete_message_by_id.py
