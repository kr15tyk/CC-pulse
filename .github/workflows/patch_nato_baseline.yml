name: Patch NATO Cisco Baseline (one-time)

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout snapshots branch as worktree
        run: |
          git fetch origin snapshots
          git worktree add snapshot-store snapshots

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Patch NATO baseline
        run: python scripts/patch_nato_baseline.py

      - name: Commit snapshots to snapshots branch
        run: |
          cd snapshot-store
          git config user.name "cc-pulse-bot"
          git config user.email "cc-pulse-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: manual NATO Cisco baseline correction (30->40 products) [skip ci]"
          git push origin snapshots
