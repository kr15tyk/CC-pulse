name: Edit Webex Message (one-time)
on:
  workflow_dispatch:
    inputs:
      activity_uuid:
        description: Webex activity UUID
        required: false
        default: eec00e00-33e4-11f1-92ad-f790e0cd507b
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Debug and edit message via bot token
        env:
          BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          tok = os.environ['BOT_TOKEN']
          room_id = os.environ['ROOM_ID']

          def api_get(path):
              req = urllib.request.Request(
                  'https://webexapis.com/v1' + path,
                  headers={'Authorization': 'Bearer ' + tok})
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return json.loads(r.read().decode()), r.status
              except urllib.error.HTTPError as e:
                  return {'_error': e.code, '_body': e.read().decode()[:300]}, e.code

          # Step 1: Verify bot identity
          me, status = api_get('/people/me')
          print(f'Bot identity: {me.get("id","?")} / {me.get("displayName","?")} / {me.get("emails",["?"])[0] if me.get("emails") else "?"}')
          print(f'Room ID: {room_id[:20]}...')

          # Step 2: List messages in the room - use before/after params
          msgs, status = api_get(f'/messages?roomId={room_id}&max=10')
          if '_error' in msgs:
              print(f'Messages list error {msgs["_error"]}: {msgs["_body"]}')
          else:
              items = msgs.get('items', [])
              print(f'Got {len(items)} messages')
              for m in items:
                  text = m.get('text', '')[:80]
                  print(f'  [{m["id"][:20]}...] created={m.get("created","?")} personId={m.get("personId","?")} text={text!r}')

          PYEOF
