name: Edit Webex Message (one-time)
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'delete_and_repost or put_only'
        required: false
        default: delete_and_repost
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Delete bad message and post corrected version
        env:
          BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
          ACTION: ${{ github.event.inputs.action }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          tok = os.environ['BOT_TOKEN']
          room_id = os.environ['ROOM_ID']
          action = os.environ.get('ACTION', 'delete_and_repost')

          # Hydra message ID of the bad celebration post
          bad_msg_id = 'Y2lzY29zcGFyazovL3VzL01FU1NBR0UvZWVjMDBiMDAtMzNlNC0xMWYxLTkyYWQtZjc5MGUwY2Q1MDdi'

          # Corrected markdown content
          md = (
              "# \U0001F3C6 Cisco NDcPP PCL \u2014 1 New Certification!\n\n"
              "\U0001F38A \U0001F38A \U0001F38A\n\n"
              "_CC Pulse detected 1 new Cisco product certification on the NIAP PCL._\n\n"
              "### \U0001F389 [Cisco 8200, 8300, 8400, 8500 Series Secure Routers (C8000) running IOS-XE 17.18]"
              "(https://www.niap-ccevs.org/product/index.cfm?pid=11661)\n\n"
              "| Field | Value |\n"
              "|-------|-------|\n"
              "| **Vendor** | Cisco Systems, Inc. |\n"
              "| **Certified** | 2026-04-09 |\n"
              "| **Valid until** | 2028-04-09 |\n"
              "| **Evaluated against** | CPP\\_ND\\_V3.0E, PKG\\_SSH\\_V1.0, MOD\\_MACSEC\\_V1.0, MOD\\_VPNGW\\_v1.3 |\n"
              "| **Evaluating lab** | Lightship Security USA, Inc. |\n"
              "| **Submitting country** | United States |\n\n"
              "---\n\n"
              "[View Cisco products on NIAP PCL](https://www.niap-ccevs.org/product/index.cfm)"
              " \u00b7 [Full dashboard](https://kr15tyk.github.io/CC-pulse/cc_dashboard.html)"
          )

          def api_call(url, method='GET', data=None):
              req = urllib.request.Request(
                  url, data=data,
                  headers={
                      'Content-Type': 'application/json',
                      'Authorization': 'Bearer ' + tok,
                  },
                  method=method)
              try:
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status, r.read().decode()[:300]
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:300]

          if action in ('delete_and_repost', 'delete_only'):
              # Step 1: Try PUT first (edit in place)
              status, body = api_call(
                  'https://webexapis.com/v1/messages/' + bad_msg_id,
                  method='PUT',
                  data=json.dumps({'markdown': md}).encode())
              print(f'PUT result: {status} {body[:200]}')

              if status == 200:
                  print('Successfully EDITED the message in place!')
              else:
                  print(f'PUT failed ({status}), trying DELETE + POST...')
                  # Step 2: Delete the bad message
                  status2, body2 = api_call(
                      'https://webexapis.com/v1/messages/' + bad_msg_id,
                      method='DELETE')
                  print(f'DELETE result: {status2} {body2[:100]}')

                  if status2 == 204:
                      print('Deleted bad message successfully')
                      if action == 'delete_and_repost':
                          # Step 3: Post corrected message
                          status3, body3 = api_call(
                              'https://webexapis.com/v1/messages',
                              method='POST',
                              data=json.dumps({'roomId': room_id, 'markdown': md}).encode())
                          print(f'POST result: {status3} {body3[:200]}')
                          if status3 == 200:
                              print('Successfully posted corrected message!')
                  else:
                      print(f'DELETE also failed: {status2} {body2}')

          PYEOF
