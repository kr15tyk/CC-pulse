name: Edit Webex Message (one-time)
on:
  workflow_dispatch:
    inputs:
      activity_uuid:
        description: Webex activity UUID
        required: true
        default: eec00e00-33e4-11f1-92ad-f790e0cd507b
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Edit message via bot token
        env:
          BOT_TOKEN: ${{ secrets.CC_WEBEX_BOT_TOKEN }}
          ROOM_ID: ${{ secrets.CC_WEBEX_ROOM_ID }}
          UUID: ${{ github.event.inputs.activity_uuid }}
        run: |
          python3 << 'PYEOF'
          import os, base64, json, urllib.request, urllib.error

          tok = os.environ['BOT_TOKEN']
          room_id = os.environ['ROOM_ID']
          uid = os.environ['UUID']

          # Step 1: List messages to find the Hydra message ID matching our activity UUID
          # The Hydra ID for the message we want to edit
          # Try constructing with standard base64 (with padding)
          hydra = 'ciscospark://us/MESSAGE/' + uid
          mid_with_pad = base64.b64encode(hydra.encode()).decode('ascii')
          # Also try without padding
          mid_no_pad = mid_with_pad.rstrip('=')
          print('With padding:', mid_with_pad)
          print('Without padding:', mid_no_pad)

          # Step 2: List recent messages to find the correct ID
          req = urllib.request.Request(
              f'https://webexapis.com/v1/messages?roomId={room_id}&max=50',
              headers={'Authorization': 'Bearer ' + tok},
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  data = json.loads(resp.read().decode())
                  messages = data.get('items', [])
                  print(f'Found {len(messages)} messages')
                  # Find the message about NDcPP celebration
                  for msg in messages:
                      text = msg.get('text', '') + msg.get('markdown', '')
                      if 'Unknown product' in text or 'NDcPP PCL' in text or 'New Certifications' in text:
                          print('FOUND TARGET MESSAGE:', msg['id'])
                          print('Created:', msg.get('created'))
                          break
          except urllib.error.HTTPError as e:
              print('List ERR', e.code, e.read().decode()[:200])
          PYEOF
